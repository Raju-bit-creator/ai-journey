services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_journey
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_journey
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"

  python:
    build: ./python
    restart: unless-stopped
    ports:
      - "8000:8000"

  frontend:
    build: .
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      BACKEND_URL: http://backend:3001
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
